# Alembic configuration (database migrations).
#
# The database URL is NOT stored here: migrations/env.py reads it from the
# application settings (backend/.env), so credentials live in exactly one place.
#
# Common commands (run from the backend/ directory, with the venv activated):
#   alembic revision --autogenerate -m "add users table"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
